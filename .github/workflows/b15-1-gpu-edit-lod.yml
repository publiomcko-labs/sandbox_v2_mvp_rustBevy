name: B15.1 GPU residency and edit priority A/B Windows Vulkan
on:
  push:
    branches:
      - 'fix/b15-1-gpu-edit-lod-20261124'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b15-1-gpu-edit-lod-ab
  cancel-in-progress: true
jobs:
  windows-gpu-edit-ab:
    runs-on: [self-hosted, Windows, X64, b1-vulkan-gpu]
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}\..\_b6_cargo_target
    steps:
      - uses: actions/checkout@v4
      - name: Reuse existing Windows MSVC Rust environment
        shell: cmd
        env:
          CARGO_HOME: ${{ runner.temp }}\b0-cargo
          RUSTUP_HOME: ${{ runner.temp }}\b0-rustup
        run: |
          if not exist "%CARGO_HOME%\bin\rustup.exe" (
            curl.exe --proto =https --tlsv1.2 --retry 3 -fL -o "%RUNNER_TEMP%\rustup-init.exe" https://win.rustup.rs/x86_64
            if errorlevel 1 exit /b 1
            "%RUNNER_TEMP%\rustup-init.exe" -y --no-modify-path --default-toolchain none
            if errorlevel 1 exit /b 1
          )
          "%CARGO_HOME%\bin\rustup.exe" toolchain install 1.100.0 --profile minimal --no-self-update
          if errorlevel 1 exit /b 1
          echo %CARGO_HOME%\bin>>"%GITHUB_PATH%"
          echo CARGO_HOME=%CARGO_HOME%>>"%GITHUB_ENV%"
          echo RUSTUP_HOME=%RUSTUP_HOME%>>"%GITHUB_ENV%"
      - name: Test streaming and SDF world contracts
        shell: cmd
        run: cargo +1.100.0 test --locked -p sandbox-streaming -p sandbox-world-core
      - name: Build B15.1 Release with shared Cargo target
        shell: cmd
        run: cargo +1.100.0 build --release --locked -p sandbox-game
      - name: Package Release executable and shaders
        shell: cmd
        run: |
          if not exist "b14-runtime\assets" mkdir "b14-runtime\assets"
          copy /Y "%CARGO_TARGET_DIR%\release\sandbox-game.exe" "b14-runtime\sandbox-game.exe"
          if errorlevel 1 exit /b 1
          xcopy /E /I /Y "assets\shaders" "b14-runtime\assets\shaders"
          if errorlevel 1 exit /b 1
      - name: Run matched Vulkan A/B with scripted SDF edits
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\b15-1-windows-ab.ps1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b15-1-gpu-edit-ab-evidence
          path: |
            b15-1-evidence/
            b14-evidence/
          if-no-files-found: warn
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: b15-1-windows-release
          path: b14-runtime/
          if-no-files-found: error
