name: Comparison V1 portable benchmark contracts (no heavy runtime)
on:
  push:
    branches:
      - bench/comparison-v1-20261125
    paths:
      - 'benchmarks/comparison-v1.json'
      - 'scripts/comparison-v1-reduce.py'
      - 'scripts/comparison-v1-compare.py'
      - 'scripts/comparison-v1-windows.ps1'
      - 'tests/test_comparison_v1.py'
      - 'tests/test_comparison_aggregate_v1.py'
      - '.github/workflows/comparison-v1-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared scenario, reducer and pair comparator (NO GPU benchmark)
        run: python3 -m unittest discover -s tests -p 'test_comparison*.py' -v
  windows-powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse benchmark runner without executing a game
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'scripts\comparison-v1-windows.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          Write-Host 'COMPARISON_V1_POWERSHELL_PARSE_PASS'
