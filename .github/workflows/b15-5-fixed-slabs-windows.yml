name: B15.5 fixed GPU mesh slabs essential Vulkan A/B
on:
  push:
    branches:
      - 'exp/b15-5-fixed-mesh-slabs-20261125'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b15-5-fixed-mesh-slabs
  cancel-in-progress: true
jobs:
  windows-vulkan-ab:
    runs-on: [self-hosted, Windows, X64, b1-vulkan-gpu]
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}\..\_b6_cargo_target
    steps:
      - uses: actions/checkout@v4
      - name: Reuse known Windows MSVC Rust environment
        shell: cmd
        env:
          CARGO_HOME: ${{ runner.temp }}\b0-cargo
          RUSTUP_HOME: ${{ runner.temp }}\b0-rustup
        run: |
          if not exist "%CARGO_HOME%\bin\rustup.exe" (
            curl.exe --proto =https --tlsv1.2 --retry 3 -fL -o "%RUNNER_TEMP%\rustup-init.exe" https://win.rustup.rs/x86_64
            if errorlevel 1 exit /b 1
            "%RUNNER_TEMP%\rustup-init.exe" -y --no-modify-path --default-toolchain none
            if errorlevel 1 exit /b 1
          )
          "%CARGO_HOME%\bin\rustup.exe" toolchain install 1.100.0 --profile minimal --no-self-update
          if errorlevel 1 exit /b 1
          echo %CARGO_HOME%\bin>>"%GITHUB_PATH%"
          echo CARGO_HOME=%CARGO_HOME%>>"%GITHUB_ENV%"
          echo RUSTUP_HOME=%RUSTUP_HOME%>>"%GITHUB_ENV%"
      - name: Build experimental Rust Release once
        shell: cmd
        run: cargo +1.100.0 build --release --locked -p sandbox-game
      - name: Stage headless Vulkan runtime
        shell: cmd
        run: |
          if not exist "b14-runtime\assets" mkdir "b14-runtime\assets"
          copy /Y "%CARGO_TARGET_DIR%\release\sandbox-game.exe" "b14-runtime\sandbox-game.exe"
          if errorlevel 1 exit /b 1
          xcopy /E /I /Y "assets\shaders" "b14-runtime\assets\shaders"
          if errorlevel 1 exit /b 1
      - name: Compare growing vs fixed slabs on same six-edit Vulkan route
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\b15-5-windows-fixed-slab-ab.ps1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b15-5-fixed-slab-ab-evidence
          path: b15-5-evidence/
          if-no-files-found: warn
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: b15-5-fixed-slab-windows-runtime
          path: b14-runtime/
          if-no-files-found: error
