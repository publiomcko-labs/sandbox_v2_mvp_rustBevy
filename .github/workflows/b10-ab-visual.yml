name: B10 A/B water, LOD and GPU terrain continuity
on:
  push:
    branches:
      - 'fix/b10-*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b10-ab-geometry
  cancel-in-progress: true
jobs:
  release:
    runs-on: [self-hosted, Windows, X64, b1-vulkan-gpu]
    timeout-minutes: 110
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}\\..\\_b6_cargo_target
    steps:
      - uses: actions/checkout@v4
      - name: Use cached native Rust toolchain
        shell: cmd
        env:
          CARGO_HOME: ${{ runner.temp }}\\b0-cargo
          RUSTUP_HOME: ${{ runner.temp }}\\b0-rustup
        run: |
          if not exist "%CARGO_HOME%\\bin\\rustup.exe" (
            curl.exe --proto =https --tlsv1.2 --retry 3 -fL -o "%RUNNER_TEMP%\\rustup-init.exe" https://win.rustup.rs/x86_64
            if errorlevel 1 exit /b 1
            "%RUNNER_TEMP%\\rustup-init.exe" -y --no-modify-path --default-toolchain none
            if errorlevel 1 exit /b 1
          )
          "%CARGO_HOME%\\bin\\rustup.exe" toolchain install 1.100.0 --profile minimal --component rustfmt --no-self-update
          if errorlevel 1 exit /b 1
          echo %CARGO_HOME%\\bin>>"%GITHUB_PATH%"
          echo CARGO_HOME=%CARGO_HOME%>>"%GITHUB_ENV%"
          echo RUSTUP_HOME=%RUSTUP_HOME%>>"%GITHUB_ENV%"
      - name: Compile B10 shader and water visibility A/B
        shell: cmd
        run: cargo +1.100.0 build --release --locked -p sandbox-game
      - name: Package B10 GPU runtime
        shell: cmd
        run: |
          if not exist "dist\b10\assets" mkdir "dist\b10\assets"
          copy /Y "%CARGO_TARGET_DIR%\release\sandbox-game.exe" "dist\b10\sandbox-game.exe"
          if errorlevel 1 exit /b 1
          xcopy /E /I /Y "assets\shaders" "dist\b10\assets\shaders"
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: b10-ab-windows-runtime
          path: dist/b10
          if-no-files-found: error
  visual-ab:
    needs: release
    runs-on: [self-hosted, Windows, X64, b1-vulkan-gpu]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: b10-ab-windows-runtime
          path: b10-runtime
      - name: Compare same positions at 25s and 57s across four A/B arms
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\\scripts\\b10-water-lod-ab.ps1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b10-ab-visual-evidence
          path: b10-ab-report/
          if-no-files-found: warn
